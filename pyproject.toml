[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asem-refine"
version = "0.1.0"
description = "Sample-specific reference sequence estimation from low-depth short reads and a divergent starting reference (ASEM / ASEM-Hybrid)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Punpiti Piamsa-nga", email = "pp@ku.ac.th" },
    { name = "Nalina Phisanbut" },
    { name = "Poonsak Nuchsiri" },
    { name = "Benchapol Benchaphattharaworakul" },
]
dependencies = [
    "numpy>=1.24",
    "parasail>=1.3",
    "requests>=2.28",
]

[project.scripts]
asem-refine = "asem_refine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
